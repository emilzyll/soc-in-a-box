<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 600" width="910" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="910" height="600" fill="#ffffff"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- isolated network -->
  <rect x="200" y="140" width="690" height="440" rx="12" fill="#f5f7fb" stroke="#6c8ebf" stroke-dasharray="8 5" stroke-width="1.5"/>
  <text x="216" y="164" font-size="14" font-weight="700" fill="#2b4a7a">vmnet2 · Host-only · 10.10.10.0/24 (isolated network)</text>

  <!-- internet services -->
  <ellipse cx="720" cy="62" rx="165" ry="50" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5"/>
  <text x="720" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="#333">External services</text>
  <text x="720" y="76" text-anchor="middle" font-size="12" fill="#333">VirusTotal · AbuseIPDB · Jira · Telegram</text>

  <!-- switch -->
  <rect x="230" y="335" width="630" height="24" rx="5" fill="#4d4d4d"/>
  <text x="545" y="352" text-anchor="middle" font-size="11" fill="#fff">vmnet2 (virtual switch)</text>

  <!-- links to switch -->
  <g stroke="#333" stroke-width="2">
    <line x1="385" y1="270" x2="385" y2="335"/>
    <line x1="725" y1="270" x2="725" y2="335"/>
    <line x1="325" y1="359" x2="325" y2="440"/>
    <line x1="545" y1="359" x2="545" y2="440"/>
    <line x1="765" y1="359" x2="765" y2="440"/>
    <polyline points="170,335 200,335 200,347 230,347" fill="none"/>
  </g>

  <!-- host -->
  <rect x="20" y="300" width="150" height="70" rx="8" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.5"/>
  <text x="95" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#333">Host</text>
  <text x="95" y="343" text-anchor="middle" font-size="12" fill="#333">Linux Mint + VMware</text>
  <text x="95" y="360" text-anchor="middle" font-size="12" fill="#333">10.10.10.1</text>

  <!-- WAZUH -->
  <rect x="300" y="200" width="170" height="70" rx="8" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="385" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#333">WAZUH</text>
  <text x="385" y="243" text-anchor="middle" font-size="12" fill="#333">SIEM</text>
  <text x="385" y="260" text-anchor="middle" font-size="12" fill="#333">10.10.10.40</text>

  <!-- SOAR -->
  <rect x="640" y="200" width="170" height="70" rx="8" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5"/>
  <text x="725" y="226" text-anchor="middle" font-size="13" font-weight="700" fill="#333">SOAR</text>
  <text x="725" y="243" text-anchor="middle" font-size="12" fill="#333">Automation</text>
  <text x="725" y="260" text-anchor="middle" font-size="12" fill="#333">10.10.10.50</text>

  <!-- endpoints -->
  <rect x="240" y="440" width="170" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="325" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#333">DC01</text>
  <text x="325" y="483" text-anchor="middle" font-size="12" fill="#333">AD DS + DNS</text>
  <text x="325" y="500" text-anchor="middle" font-size="12" fill="#333">10.10.10.10</text>

  <rect x="460" y="440" width="170" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="545" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#333">WS01</text>
  <text x="545" y="483" text-anchor="middle" font-size="12" fill="#333">Windows 11</text>
  <text x="545" y="500" text-anchor="middle" font-size="12" fill="#333">10.10.10.20</text>

  <rect x="680" y="440" width="170" height="70" rx="8" fill="#f8cecc" stroke="#b85450" stroke-width="1.5"/>
  <text x="765" y="466" text-anchor="middle" font-size="13" font-weight="700" fill="#333">LNX01</text>
  <text x="765" y="483" text-anchor="middle" font-size="12" fill="#333">Ubuntu Server</text>
  <text x="765" y="500" text-anchor="middle" font-size="12" fill="#333">10.10.10.30</text>

  <!-- flows -->
  <line x1="470" y1="235" x2="636" y2="235" stroke="#6c8ebf" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="553" y="227" text-anchor="middle" font-size="11" fill="#2b4a7a">alerts (webhook)</text>

  <line x1="725" y1="200" x2="725" y2="116" stroke="#b8962e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="735" y="150" font-size="11" fill="#8a6d1a">NAT (temporary):</text>
  <text x="735" y="164" font-size="11" fill="#8a6d1a">enrichment,</text>
  <text x="735" y="178" font-size="11" fill="#8a6d1a">tickets, notifications</text>

  <!-- legend -->
  <text x="240" y="540" font-size="11" fill="#555">Wazuh agents on DC01, WS01, LNX01 → WAZUH (1514/1515 TCP)</text>
  <text x="240" y="556" font-size="11" fill="#555">DNS and soc.lab domain → DC01</text>
</svg>
